[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-push"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "PyJWT>=2.8",
    "vr-common @ file:../../packages/common",
]

[tool.setuptools.packages.find]
where = ["src"]
